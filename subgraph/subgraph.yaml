specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PolyManager
    network: mainnet
    source:
      address: "0x838bf9E95CB12Dd76a54C9f9D2E3082EAF928270"
      abi: PolyManager
      startBlock: 12996659
      endBlock: 12996660
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - HistoricalExploit
      abis:
        - name: PolyManager
          file: ./abis/PolyManager.json
      eventHandlers:
        - event: VerifyHeaderAndExecuteTxEvent(uint64,bytes,bytes,bytes)
          handler: handlePolyExploit
      file: ./src/mapping.ts
  - kind: ethereum
    name: ResupplyToken
    network: mainnet
    source:
      address: "0x57aB1E0003F623289CD798B1824Be09a793e4Bec"
      abi: ResupplyToken
      startBlock: 22785461
      endBlock: 22785462
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - HistoricalExploit
      abis:
        - name: ResupplyToken
          file: ./abis/ResupplyToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleResupplyExploit
      file: ./src/mapping.ts
  - kind: ethereum
    name: TheDao
    network: mainnet
    source:
      address: "0xbb9bc244d798123fde783fcc1c72d3bb8c189413"
      abi: TheDao
      startBlock: 1718497
      endBlock: 1718498
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - HistoricalExploit
      abis:
        - name: TheDao
          file: ./abis/TheDao.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleDaoExploit
      file: ./src/mapping.ts
