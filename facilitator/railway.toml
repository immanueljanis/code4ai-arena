# Facilitator service. Set the Railway service Root Directory to `facilitator`
# so this file and the Dockerfile's COPY paths resolve against facilitator/.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["src/**", "package.json", "bun.lock", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
